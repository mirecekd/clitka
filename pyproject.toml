[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clitka"
# PEP 440 form of the date-based build version in src/clitka/__init__.py
# (v260731.1 -> 260731.1). Bump both together.
version = "260803.2"

description = "CLITKA - CLI ToolKit for AWS: the AWS Toolkit workflow in your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Miroslav Dvorak", email = "mirecekd@gmail.com" }]
keywords = ["aws", "cli", "tui", "textual", "devops", "cloudwatch", "lambda"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15",
    "textual>=1.0",
    "rich>=13.9",
    "boto3>=1.35",
    "botocore>=1.35",
    "pluggy>=1.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
async = ["aioboto3>=13.2"]

[project.urls]
Homepage = "https://github.com/mirecekd/clitka"
Repository = "https://github.com/mirecekd/clitka"
Issues = "https://github.com/mirecekd/clitka/issues"

[project.scripts]
clitka = "clitka.cli.main:run"


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "moto[s3,dynamodb,logs,lambda]>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clitka"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: typer.Option(...) as a default is the Typer idiom.
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
# Textual declares BINDINGS / CSS as plain class attributes by design.
extend-immutable-calls = ["textual.binding.Binding"]

[tool.ruff.lint.per-file-ignores]
# RUF012: Textual's BINDINGS contract is a plain mutable class attribute.
"src/clitka/tui/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
